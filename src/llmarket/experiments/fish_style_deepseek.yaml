# Fish-style duopoly with a paid model. Run `llmarket estimate` first; spending stops at the
# budget (checked before every call; the session ends after the current period).
# Needs the environment variable DEEPSEEK_API_KEY.
experiment: fish_style_deepseek
description: "Fish et al. (2024) structure on DeepSeek (paid; run `llmarket estimate` first)"
sessions: 3
periods: 300
seed: 20261021
market: {scenario: bertrand_logit, n: 2, a: 2.0, a0: 0.0, mu: 0.25, c: 1.0, units: {alpha: 3.2, beta: 100}}
agents:
  # DeepSeek runs in thinking mode by default, which ignores temperature and spends hidden
  # reasoning tokens; Fish et al. used non-reasoning models, so it is switched off here.
  - {type: llm, provider: deepseek, model: deepseek-flash, prompt: fish_style, prefix: explore,
     temperature: 1.0, max_tokens: 1000, extra_body: {thinking: {type: disabled}}}
  - {copy_of: 0}
llm:
  cache: {mode: use}
  budget: {amount: 30, currency: CNY}
  on_parse_failure: {retries: 10, then: stop}
  concurrency: 2
  parallel_sessions: 3
metrics: {final_window: 50}
