[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tatonnement"
version = "0.1.0.dev0"
description = "Economics-first agent-based simulation with LLM, reinforcement-learning and rule-based agents; first scenario: algorithmic pricing under price regulation."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chao (Charles) Cheng" }]
keywords = ["agent-based modeling", "large language models", "algorithmic collusion", "Q-learning", "Bertrand competition", "price regulation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "httpx>=0.27",
  "pyyaml>=6",
]

[project.optional-dependencies]
fast = ["numba>=0.59"]
analysis = ["pandas>=2.1", "pyarrow>=14", "matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.5", "numba>=0.59", "pandas>=2.1", "pyarrow>=14"]

[project.scripts]
tatonnement = "tatonnement.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tatonnement"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: long-running validation tests",
  "live: tests that call real LLM endpoints (opt-in)",
]
addopts = "-m 'not slow and not live'"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["E741", "B905"]
