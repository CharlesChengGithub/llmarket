[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "llmarket"
dynamic = ["version"]
description = "Economics-first agent-based simulation with LLM, reinforcement-learning and rule-based agents; first scenario: algorithmic pricing under price regulation."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chao (Charles) Cheng", email = "charlescheng1992@gmail.com" }]
keywords = ["agent-based modeling", "large language models", "algorithmic collusion", "Q-learning", "Bertrand competition", "price regulation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "httpx>=0.27",
  "pyyaml>=6",
  "numba>=0.59",
]

[project.urls]
Homepage = "https://github.com/CharlesChengGithub/llmarket"
Issues = "https://github.com/CharlesChengGithub/llmarket/issues"
Changelog = "https://github.com/CharlesChengGithub/llmarket/blob/main/CHANGELOG.md"

[project.optional-dependencies]
analysis = ["pandas>=2.1", "pyarrow>=14", "matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.5", "pandas>=2.1", "pyarrow>=14"]

[project.scripts]
llmarket = "llmarket.cli:main"

[tool.hatch.version]
path = "src/llmarket/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/llmarket"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: long-running validation tests",
  "live: tests that call real LLM endpoints (opt-in)",
]
addopts = "-m 'not slow and not live'"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["E741", "B905"]
